<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Toonie Player</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
  /* ============================================================
     SECTION 01 · BASE STYLES
     Reset, body, player wrap, video element
     ============================================================ */

    *{ box-sizing: border-box; margin: 0; padding: 0; }

    body{
      background: #000;
      color: #fff;
      font-family: "Roboto", system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #player-wrap{
      position: fixed;
      inset: 0;
      background: #000;
    }

    #main-video{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

  /* ============================================================
     SECTION 02 · PLAYER UI OVERLAY
     Top bar, middle controls, bottom bar
     ============================================================ */

    #ui{
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: opacity 0.3s ease;
    }
    #ui.hidden{ opacity: 0; pointer-events: none; }

    #top{
      display: flex;
      align-items: center;
      padding: 14px 16px 24px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.80) 0%, transparent 100%);
      gap: 12px;
    }

    #title{
      flex: 1;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #star-btn{
      font-size: 24px;
      color: #fff;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
      line-height: 1;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      flex-shrink: 0;
    }

    #mid{
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .ctrl{
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.9;
    }
    .ctrl:active{ opacity: 0.6; }

    #playpause{
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      color: #000;
      font-size: 26px;
    }

    .ep-btn{ font-size: 30px; }
    .seek-btn{ font-size: 22px; position: relative; }

    #bottom{
      padding: 8px 16px 24px;
      background: linear-gradient(to top, rgba(0,0,0,0.80) 0%, transparent 100%);
    }

    #seek{
      width: 100%;
      height: 4px;
      accent-color: #fff;
      cursor: pointer;
      margin-bottom: 10px;
      display: block;
    }

    #bottom-row{
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #time{
      font-size: 13px;
      color: #fff;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    #right-btns{
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #sleep-btn, #speed-btn, #fs-btn{
      background: none;
      border: none;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 8px;
      opacity: 0.9;
      white-space: nowrap;
    }
    #fs-btn{ font-size: 20px; }

    #sleep-btn.active{
      color: #D0BCFF;
      opacity: 1;
    }

  /* ============================================================
     SECTION 03 · SLEEP TIMER OVERLAY
     Shown when episode limit is reached
     ============================================================ */

    #sleep-overlay{
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.82);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      z-index: 100;
    }
    #sleep-overlay.show{ display: flex; }

    #sleep-overlay .sleep-icon{
      font-size: 48px;
      line-height: 1;
    }

    #sleep-overlay .sleep-title{
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      text-align: center;
    }

    #sleep-overlay .sleep-sub{
      font-size: 14px;
      color: rgba(255,255,255,0.65);
      text-align: center;
    }

    #sleep-overlay .sleep-btns{
      display: flex;
      gap: 12px;
      margin-top: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #sleep-overlay button{
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }

    #sleep-continue-btn{
      background: rgba(208,188,255,0.18);
      border: 1px solid rgba(208,188,255,0.45) !important;
      color: #D0BCFF;
    }

    #sleep-close-btn{
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18) !important;
      color: rgba(255,255,255,0.75);
    }

  /* ============================================================
     SECTION 04 · MISC UI
     Error state, wishlist toast
     ============================================================ */

    #error-msg{
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      background: #111;
      color: #fff;
      font-size: 16px;
      text-align: center;
      padding: 24px;
    }
    #error-msg.show{ display: flex; }

    #error-msg button{
      background: rgba(208,188,255,0.2);
      border: 1px solid rgba(208,188,255,0.4);
      color: #D0BCFF;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
    }

    #wl-toast{
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(208,188,255,0.18);
      border: 1px solid rgba(208,188,255,0.4);
      color: #D0BCFF;
      padding: 8px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      white-space: nowrap;
      z-index: 200;
    }
    #wl-toast.show{ opacity: 1; }
  </style>
</head>
<body>

<!-- ============================================================
     SECTION 05 · HTML STRUCTURE
     Player wrap, video, UI overlay, sleep overlay, error, toast
     ============================================================ -->

<div id="player-wrap">
  <video id="main-video" playsinline></video>

  <div id="ui">
    <div id="top">
      <div id="title">Now Playing</div>
      <button id="star-btn">☆</button>
    </div>

    <div id="mid">
      <button class="ctrl ep-btn" id="prev-btn">⏮</button>
      <button class="ctrl seek-btn" id="back5-btn">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="white">
          <path d="M12 5V2L8 6l4 4V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
          <text x="12" y="15" text-anchor="middle" font-size="6" fill="white" font-weight="bold">5</text>
        </svg>
      </button>
      <button class="ctrl" id="playpause">▶</button>
      <button class="ctrl seek-btn" id="fwd15-btn">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="white">
          <path d="M12 5V2l4 4-4 4V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
          <text x="12" y="15" text-anchor="middle" font-size="6" fill="white" font-weight="bold">15</text>
        </svg>
      </button>
      <button class="ctrl ep-btn" id="next-btn">⏭</button>
    </div>

    <div id="bottom">
      <input type="range" id="seek" value="0" min="0" step="0.1">
      <div id="bottom-row">
        <div id="time">0:00 · 0:00</div>
        <div id="right-btns">
          <button id="sleep-btn">⏾</button>
          <button id="speed-btn">1×</button>
          <button id="fs-btn">⛶</button>
        </div>
      </div>
    </div>
  </div>

  <div id="sleep-overlay">
    <div class="sleep-icon">⏾</div>
    <div class="sleep-title">Sleep limit reached</div>
    <div class="sleep-sub" id="sleep-sub-text"></div>
    <div class="sleep-btns">
      <button id="sleep-continue-btn">Continue Watching</button>
      <button id="sleep-close-btn">Close Tab</button>
    </div>
  </div>

  <div id="error-msg">
    <div>No video session found.</div>
    <button onclick="window.close()">Close Tab</button>
  </div>
</div>

<div id="wl-toast"></div>

<script>
/* ============================================================
   SECTION 06 · CONFIG & SESSION LOAD
   Supabase credentials, storage keys, session parsing
   ============================================================ */
(function(){

  const SUPABASE_URL      = "https://tdpyeauwzdktfihqqyxc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_WhASrKnpqODlxsod-B1AhQ___lLXnpe";
  const WISHLIST_TABLE    = "toonie_wishlist_state";
  const WISHLIST_KEY      = "toonie_wishlist_v1";
  const ROOM_KEY          = "toonie_room_code_v1";
  const PENDING_KEY       = "toonie_pending_progress_v1";
  const SESSION_KEY       = "toonie_player_session_v1";
  const SPEEDS            = [0.5, 0.75, 1, 1.25, 1.5, 2];
  const SLEEP_OPTIONS     = [0, 1, 2, 3, 4, 5];

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let session = null;
  try{ session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); }catch(e){}

  if(!session || !Array.isArray(session.queue) || !session.queue.length){
    document.getElementById("error-msg").classList.add("show");
    return;
  }

  const { queue, source = "direct_card", profile = "Asim" } = session;
  let currentIndex = Number(session.startIndex) || 0;

/* ============================================================
   SECTION 07 · DOM REFERENCES
   ============================================================ */

  const video            = document.getElementById("main-video");
  const ui               = document.getElementById("ui");
  const titleEl          = document.getElementById("title");
  const starBtn          = document.getElementById("star-btn");
  const prevBtn          = document.getElementById("prev-btn");
  const nextBtn          = document.getElementById("next-btn");
  const back5            = document.getElementById("back5-btn");
  const fwd15            = document.getElementById("fwd15-btn");
  const ppBtn            = document.getElementById("playpause");
  const seekBar          = document.getElementById("seek");
  const timeEl           = document.getElementById("time");
  const sleepBtn         = document.getElementById("sleep-btn");
  const speedBtn         = document.getElementById("speed-btn");
  const fsBtn            = document.getElementById("fs-btn");
  const sleepOverlay     = document.getElementById("sleep-overlay");
  const sleepSubText     = document.getElementById("sleep-sub-text");
  const sleepContinueBtn = document.getElementById("sleep-continue-btn");
  const sleepCloseBtn    = document.getElementById("sleep-close-btn");
  const wlToast          = document.getElementById("wl-toast");

  let hideTimer = null;
  let speedIdx  = 2;

/* ============================================================
   SECTION 08 · SLEEP TIMER
   State: sleepLimitIdx (cycles 0-5), sleepRemaining (countdown).
   Only natural episode end (video ended event) counts.
   Manual Next button does NOT count toward the limit.
   ============================================================ */

  let sleepLimitIdx  = 0;
  let sleepRemaining = 0;

  function sleepLimit(){ return SLEEP_OPTIONS[sleepLimitIdx]; }

  function refreshSleepBtn(){
    if(sleepLimit() === 0){
      sleepBtn.textContent = "⏾";
      sleepBtn.classList.remove("active");
    } else {
      sleepBtn.textContent = "⏾ " + sleepRemaining;
      sleepBtn.classList.add("active");
    }
  }

  function cycleSleepLimit(){
    sleepLimitIdx  = (sleepLimitIdx + 1) % SLEEP_OPTIONS.length;
    sleepRemaining = sleepLimit();
    refreshSleepBtn();
    showUI();
  }

  function onEpisodeNaturalEnd(){
    if(sleepLimit() === 0) return false;
    sleepRemaining = Math.max(0, sleepRemaining - 1);
    refreshSleepBtn();
    if(sleepRemaining === 0){
      const n = sleepLimit();
      sleepSubText.textContent =
        `You watched ${n} episode${n !== 1 ? "s" : ""}. Time to rest!`;
      sleepOverlay.classList.add("show");
      ui.classList.add("hidden");
      return true;
    }
    return false;
  }

  function dismissSleepOverlay(){
    sleepOverlay.classList.remove("show");
    sleepLimitIdx  = 0;
    sleepRemaining = 0;
    refreshSleepBtn();
  }

  sleepBtn.addEventListener("click", cycleSleepLimit);

  sleepContinueBtn.addEventListener("click", () => {
    dismissSleepOverlay();
    if(currentIndex < queue.length - 1) loadAndPlay(currentIndex + 1);
    showUI();
  });

  sleepCloseBtn.addEventListener("click", () => window.close());

/* ============================================================
   SECTION 09 · WATCH TRACKING
   30% watch time + 70% position reached = qualified
   On qualify: save to pending progress in localStorage
   ============================================================ */

  let watchedMs = 0, maxPositionSec = 0, lastTickTime = null, qualified = false;
  let tickInterval = null;

  function resetWatchState(){
    watchedMs = 0; maxPositionSec = 0;
    lastTickTime = null; qualified = false;
  }

  function tickWatch(){
    if(!video.paused && !video.ended && lastTickTime !== null){
      watchedMs += (Date.now() - lastTickTime);
    }
    lastTickTime = Date.now();
    const dur = video.duration || 0;
    const pos = video.currentTime || 0;
    if(pos > maxPositionSec) maxPositionSec = pos;
    if(!qualified && dur > 0){
      if(watchedMs >= dur * 1000 * 0.30 && maxPositionSec >= dur * 0.70){
        qualified = true;
        saveProgress(queue[currentIndex]);
      }
    }
  }

  function startTick(){ tickInterval = setInterval(tickWatch, 250); }
  function stopTick(){ clearInterval(tickInterval); tickInterval = null; lastTickTime = null; }

/* ============================================================
   SECTION 10 · PROGRESS SAVING
   Writes entry to toonie_pending_progress_v1.
   Main tab reads this on focus and applies via applyProgress()
   ============================================================ */

  function saveProgress(item){
    if(!item || !item.cartoonLabel) return;
    if(String(source) === "wishlist") return;
    try{
      const entry = {
        cartoonLabel:  item.cartoonLabel,
        seriesLabel:   item.seriesLabel || "",
        type:          item.type || "season",
        seasonOrMovie: item.seasonOrMovie || "",
        num:           Number(item.num) || 0,
        source:        source || "direct_card",
        ts:            new Date().toISOString()
      };
      const existing = JSON.parse(localStorage.getItem(PENDING_KEY) || "[]");
      existing.push(entry);
      localStorage.setItem(PENDING_KEY, JSON.stringify(existing));
    }catch(e){}
  }

/* ============================================================
   SECTION 11 · WISHLIST
   Read/write toonie_wishlist_v1, push snapshot to Supabase
   ============================================================ */

  function normSeries(s){
    const v = s == null ? null : String(s).trim();
    if(!v || v === "-" || v.toLowerCase() === "null" || v.toLowerCase() === "none") return null;
    return v;
  }

  function wlKey(item){
    return [
      item.cartoonLabel || "",
      normSeries(item.seriesLabel) || "-",
      item.type || "season",
      item.seasonOrMovie || "",
      Number(item.num) || 0
    ].join("|");
  }

  function isWishlisted(item){
    try{
      const store = JSON.parse(localStorage.getItem(WISHLIST_KEY) || "{}");
      return (store[profile] || []).some(x => wlKey(x) === wlKey(item));
    }catch(e){ return false; }
  }

  function toggleWishlist(item){
    try{
      const store = JSON.parse(localStorage.getItem(WISHLIST_KEY) || "{}");
      if(!store[profile]) store[profile] = [];
      const list = store[profile];
      const idx  = list.findIndex(x => wlKey(x) === wlKey(item));
      let added  = false;
      if(idx >= 0){
        list.splice(idx, 1);
      } else {
        list.unshift({
          cartoonLabel: item.cartoonLabel || "",
          seriesLabel:  String(item.seriesLabel || "").trim(),
          type:         item.type || "season",
          seasonOrMovie:item.seasonOrMovie || "",
          num:          Number(item.num) || 0,
          ts:           new Date().toISOString()
        });
        added = true;
      }
      localStorage.setItem(WISHLIST_KEY, JSON.stringify(store));
      pushWishlistToCloud(store[profile]);
      return added;
    }catch(e){ return false; }
  }

  async function pushWishlistToCloud(items){
    const room = (localStorage.getItem(ROOM_KEY) || "").trim();
    if(!room) return;
    try{
      await sb.from(WISHLIST_TABLE).upsert({
        room_code: room, profile,
        items_json: Array.isArray(items) ? items : [],
        updated_at: new Date().toISOString()
      }, { onConflict: "room_code,profile" });
    }catch(e){}
  }

  function refreshStar(){
    starBtn.textContent = isWishlisted(queue[currentIndex]) ? "★" : "☆";
  }

  function showToast(msg){
    wlToast.textContent = msg;
    wlToast.classList.add("show");
    clearTimeout(wlToast._timer);
    wlToast._timer = setTimeout(() => wlToast.classList.remove("show"), 2000);
  }

/* ============================================================
   SECTION 12 · PLAYBACK
   loadAndPlay(), showUI(), fmt(), refreshPrevNext()
   ============================================================ */

  function fmt(s){
    s = Math.floor(s || 0);
    return Math.floor(s/60) + ":" + (s%60 < 10 ? "0" : "") + (s%60);
  }

  function refreshPrevNext(){
    prevBtn.style.opacity = currentIndex > 0 ? "1" : "0.3";
    nextBtn.style.opacity = currentIndex < queue.length - 1 ? "1" : "0.3";
  }

  function loadAndPlay(idx){
    if(idx < 0 || idx >= queue.length) return;
    currentIndex = idx;
    resetWatchState();
    const item = queue[idx];
    video.src = item.url;
    video.load();
    video.play().catch(() => {});
    titleEl.textContent = item.title || "Now Playing";
    document.title      = item.title || "Toonie Player";
    refreshStar();
    refreshPrevNext();
    ppBtn.textContent = "⏸";
  }

  function showUI(){
    ui.classList.remove("hidden");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if(!video.paused) ui.classList.add("hidden");
    }, 3000);
  }

/* ============================================================
   SECTION 13 · EVENT LISTENERS
   Button clicks, video events, keyboard shortcuts
   ============================================================ */

  ppBtn.addEventListener("click", () => {
    if(video.paused){ video.play(); ppBtn.textContent = "⏸"; }
    else { video.pause(); ppBtn.textContent = "▶"; }
    showUI();
  });

  prevBtn.addEventListener("click", () => {
    if(currentIndex > 0) loadAndPlay(currentIndex - 1);
    showUI();
  });

  nextBtn.addEventListener("click", () => {
    /* Manual skip — does NOT count toward sleep timer */
    if(currentIndex < queue.length - 1) loadAndPlay(currentIndex + 1);
    showUI();
  });

  back5.addEventListener("click",  () => { video.currentTime = Math.max(0, video.currentTime - 5); showUI(); });
  fwd15.addEventListener("click",  () => { video.currentTime = Math.min(video.duration||0, video.currentTime + 15); showUI(); });

  starBtn.addEventListener("click", () => {
    const item = queue[currentIndex];
    if(!item) return;
    const added = toggleWishlist(item);
    refreshStar();
    showToast(added ? "Added to Wishlist" : "Removed from Wishlist");
    showUI();
  });

  speedBtn.addEventListener("click", () => {
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    video.playbackRate   = SPEEDS[speedIdx];
    speedBtn.textContent = SPEEDS[speedIdx] + "×";
    showUI();
  });

  fsBtn.addEventListener("click", () => {
    if(!document.fullscreenElement) document.getElementById("player-wrap").requestFullscreen?.();
    else document.exitFullscreen?.();
    showUI();
  });

  seekBar.addEventListener("input", () => {
    video.currentTime = parseFloat(seekBar.value);
    showUI();
  });

  video.addEventListener("timeupdate", () => {
    const cur = video.currentTime||0, dur = video.duration||0;
    seekBar.max = dur; seekBar.value = cur;
    timeEl.textContent = fmt(cur) + " · " + fmt(dur);
  });

  video.addEventListener("play",  () => { ppBtn.textContent = "⏸"; startTick(); });
  video.addEventListener("pause", () => { ppBtn.textContent = "▶";  stopTick();  });

  video.addEventListener("ended", () => {
    stopTick();
    tickWatch();
    const blocked = onEpisodeNaturalEnd();
    if(!blocked && currentIndex < queue.length - 1){
      loadAndPlay(currentIndex + 1);
    }
  });

  document.getElementById("player-wrap").addEventListener("click", (e) => {
    if(e.target === document.getElementById("player-wrap") || e.target === video) showUI();
  });

  document.addEventListener("keydown", (e) => {
    if(sleepOverlay.classList.contains("show")) return;
    if(e.code === "Space")      { e.preventDefault(); ppBtn.click(); }
    if(e.code === "ArrowRight") { video.currentTime += 15; showUI(); }
    if(e.code === "ArrowLeft")  { video.currentTime -= 5;  showUI(); }
    if(e.code === "KeyF")       { fsBtn.click(); }
  });

/* ============================================================
   SECTION 14 · INIT
   Start playback from session index, init sleep button
   ============================================================ */

  loadAndPlay(currentIndex);
  refreshSleepBtn();

})();
</script>
</body>
</html>
